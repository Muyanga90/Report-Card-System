<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LME Termly Report Form System</title>
<meta name="theme-color" content="#1F3A5F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231F3A5F'/%3E%3Ctext x='16' y='22' font-size='14' font-weight='700' text-anchor='middle' fill='%23E3C766' font-family='Arial'%3ELME%3C/text%3E%3C/svg%3E">
<style>
:root{
  --navy:#1F3A5F; --navy-d:#162a45; --gold:#E3C766; --gold-d:#c9a93f;
  --bg:#EEF2F7; --card:#fff; --ink:#1b2430; --mute:#5f6b7a; --line:#d5dde8;
  --green:#2E7D32; --green-l:#E8F5E9; --input:#FFFF99; --blue-l:#BBDEFB; --cream:#FFF8DC; --amber-l:#FFF2CC;
  --red:#C62828; --red-l:#FDECEA; --ok:#2E7D32;
}
*{box-sizing:border-box} html,body{margin:0;height:100%}
body{font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
h1,h2,h3{margin:0 0 .5em;color:var(--navy)} h1{font-size:1.5rem} h2{font-size:1.15rem} h3{font-size:1rem}
a{color:var(--navy)} button{font:inherit;cursor:pointer}
.hidden{display:none!important}
/* shell */
#app{display:grid;grid-template-columns:230px 1fr;grid-template-rows:56px 1fr;height:100vh}
#top{grid-column:1/3;background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:3px solid var(--gold)}
#top .brand{font-weight:700;letter-spacing:.04em;display:flex;align-items:center;gap:10px}
#top .brand i{display:inline-block;padding:0 7px;height:26px;border-radius:6px;background:var(--gold);color:var(--navy);font-style:normal;font-weight:800;font-size:13px;text-align:center;line-height:26px}
#top .sp{flex:1} #top select{background:#2a4a75;color:#fff;border:1px solid #3d5f8f;border-radius:6px;padding:5px 8px;max-width:240px}
#top .who{font-size:12px;text-align:right;line-height:1.2} #top .who b{display:block;font-size:13px}
#menuBtn{display:none;background:none;border:0;color:#fff;font-size:22px}
#side{background:var(--navy-d);color:#cfd8e6;overflow:auto;padding:10px 8px}
#side a{display:flex;align-items:center;gap:10px;color:#cfd8e6;text-decoration:none;padding:8px 10px;border-radius:8px;margin-bottom:2px}
#side a:hover{background:#243f66} #side a.on{background:var(--gold);color:var(--navy);font-weight:700}
#side .grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#8ea2c0;margin:12px 10px 4px}
#side svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#main{overflow:auto;padding:18px 22px 40px}
.page{max-width:1280px;margin:0 auto}
.page-h{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin-bottom:12px}
.page-h h1{margin:0}.page-h .sub{color:var(--mute)}.page-h .sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(31,58,95,.05)}
.card>h2:first-child,.card>h3:first-child{margin-top:0}
.note{background:var(--cream);border:1px solid #ecdca0;border-radius:8px;padding:8px 12px;color:#5b4b12;margin-bottom:12px;font-size:13px}
.err{background:var(--red-l);border-color:#f3b9b4;color:#8c1d18}
.ctxbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:10px;padding:8px 12px;margin-bottom:14px}
.ctxbar label{font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:2px}
/* controls */
input,select,textarea{font:inherit;border:1px solid #b9c4d3;border-radius:6px;padding:6px 8px;background:#fff;color:var(--ink);max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--navy)}
textarea{width:100%;min-height:80px}
.in-y{background:var(--input)} .in-b{background:var(--blue-l)}
.btn{border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:7px;padding:7px 14px;font-weight:600}
.btn:hover{background:var(--navy-d)} .btn.gold{background:var(--gold);color:var(--navy);border-color:var(--gold-d)} .btn.gold:hover{background:#efd57d}
.btn.ghost{background:#fff;color:var(--navy)} .btn.ghost:hover{background:#eef2f7}
.btn.danger{background:var(--red);border-color:var(--red)} .btn.sm{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.row.end{justify-content:flex-end}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:3px;margin-bottom:10px}.field label{font-size:12px;color:var(--mute);font-weight:600}
.field.chk{flex-direction:row;align-items:center;gap:8px}
/* tables */
.tw{overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 9px;border-bottom:1px solid #e6ebf2;text-align:left;white-space:nowrap}
th{background:var(--navy);color:#fff;font-weight:600;font-size:12px;position:sticky;top:0;z-index:1}
tbody tr:hover td{background:#f6f9fd} td.n,th.n{text-align:center}
table.green th{background:var(--green)} table.zebra tbody tr:nth-child(even) td{background:#fafcfe}
tr.on-class td{background:#dff1e0!important;font-weight:600}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600}
.pill.ok{background:var(--green-l);color:var(--green)}.pill.bad{background:var(--red-l);color:var(--red)}
.pill.warn{background:var(--amber-l);color:#8a6100}.pill.mute{background:#e8edf4;color:var(--mute)}
/* results grid */
table.entry td{padding:2px 3px}table.entry input.mk{width:56px;text-align:center;padding:4px 2px;border-radius:4px;background:var(--input);font-weight:600}
table.entry input.mk[disabled]{background:#eef1f5;color:#8a94a2}
.g1{color:#1b5e20}.g2{color:#2e7d32}.g3{color:#33691e}.g4{color:#8a6100}.g5{color:var(--red)}
input.mk.g5{background:#ffd9d6}input.mk.ab{background:#e4e8ee;color:var(--mute)}
.tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{background:var(--navy);color:#fff;border-radius:12px;padding:16px;text-decoration:none;display:block;border-bottom:4px solid var(--gold)}
.tile:hover{background:var(--navy-d)} .tile b{display:block;font-size:15px}.tile span{font-size:12px;color:#b9c6da}
.hero{background:var(--navy);color:#fff;border-radius:12px;padding:22px;text-align:center;border-bottom:5px solid var(--gold);margin-bottom:14px}
.hero small{letter-spacing:.2em;color:var(--gold)}.hero h1{color:#fff;margin:.15em 0}.hero .sch{font-size:1.35rem;font-weight:800;color:var(--gold)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:10px;padding:10px 14px}
.kpi b{font-size:1.5rem;color:var(--navy);display:block}.kpi span{font-size:12px;color:var(--mute)}
.bar{display:flex;align-items:center;gap:8px;margin:4px 0}.bar .lb{width:150px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{flex:1;background:#e7edf5;border-radius:5px;height:16px;overflow:hidden}.bar .fl{height:100%;background:var(--navy)}.bar .fl.g{background:var(--green)}.bar .fl.r{background:var(--red)}
.bar .v{width:54px;font-size:12px;text-align:right}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 14px;border-bottom:3px solid transparent;margin-bottom:-2px;color:var(--mute);font-weight:600}
.tabs button.on{color:var(--navy);border-bottom-color:var(--gold)}
/* modal & toast */
#modalRoot{position:fixed;inset:0;background:rgba(15,25,40,.55);display:flex;align-items:flex-start;justify-content:center;padding:5vh 12px;overflow:auto;z-index:50}
.modal{background:#fff;border-radius:12px;width:min(560px,100%);box-shadow:0 20px 50px rgba(0,0,0,.35);border-top:5px solid var(--gold)}
.modal.wide{width:min(860px,100%)}.modal header{padding:14px 18px 0;font-weight:700;font-size:1.1rem;color:var(--navy)}
.modal .mb{padding:12px 18px}.modal footer{padding:10px 18px 16px;display:flex;justify-content:flex-end;gap:8px}
#toasts{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:99}
.toast{background:var(--navy);color:#fff;padding:9px 14px;border-radius:8px;border-left:5px solid var(--gold);box-shadow:0 6px 18px rgba(0,0,0,.25)}.toast.bad{background:var(--red)}
/* auth */
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;background:linear-gradient(160deg,var(--navy) 0 45%,var(--bg) 45%)}
.auth .box{background:#fff;border-radius:14px;width:min(430px,100%);padding:24px;border-top:6px solid var(--gold);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.auth .logo{text-align:center;margin-bottom:12px}.auth .logo small{letter-spacing:.18em;color:var(--mute)}.auth .logo h1{margin:2px 0}
.demo-banner{background:var(--gold);color:var(--navy);font-weight:600;text-align:center;padding:4px 8px;font-size:12px}
/* report slip */
.slip{background:#fff;border:2px solid var(--navy);padding:18px 22px;max-width:780px;margin:0 auto 18px;page-break-after:always}
.slip .hd{text-align:center;color:var(--navy);border-bottom:3px double var(--navy);padding-bottom:6px;margin-bottom:8px}
.slip .hd b{display:block;font-size:13px;letter-spacing:.1em}.slip .hd .s{font-size:19px;font-weight:800}
.slip h3{text-align:center;background:var(--navy);color:#fff;padding:4px;margin:8px 0;letter-spacing:.1em}
.slip .meta{display:grid;grid-template-columns:1fr 1fr;gap:2px 22px;margin-bottom:8px}.slip .meta div{display:flex;justify-content:space-between;border-bottom:1px dotted #9aa8bb;padding:2px 0}
.slip table th{background:var(--navy)}.slip table td{white-space:normal}
.slip .cm{border:1px solid var(--line);padding:6px 9px;margin-top:8px;min-height:44px}.slip .cm b{color:var(--navy)}
.slip .sig{display:flex;justify-content:space-between;margin-top:22px;gap:30px}.slip .sig div{flex:1;border-top:1px solid #333;padding-top:3px;font-size:12px}
.res-ok{color:var(--green);font-weight:700}.res-bad{color:var(--red);font-weight:700}
#printArea{display:none}
.muted{color:var(--mute)}.right{text-align:right}.center{text-align:center}.mt{margin-top:12px}
@media(max-width:860px){#app{grid-template-columns:1fr}#side{position:fixed;top:59px;left:0;bottom:0;width:240px;z-index:30;transform:translateX(-100%);transition:.2s}#side.open{transform:none}#menuBtn{display:block}#top{grid-column:1}#main{padding:12px}.who{display:none}}
@media print{
  body{background:#fff} body>*:not(#printArea){display:none!important} #printArea{display:block!important}
  .slip{border:2px solid #000;margin:0;max-width:none;box-shadow:none} .noprint{display:none!important}
  th{-webkit-print-color-adjust:exact;print-color-adjust:exact}.slip h3{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4;margin:12mm}
}


/* ---- polish ---- */
body{background:linear-gradient(180deg,#eef2f7,#e4eaf3) fixed}
#top{box-shadow:0 2px 10px rgba(0,0,0,.2)}
#top .brand i.logo-img{background:#fff;padding:2px 6px;height:34px;line-height:0;border-radius:8px}#top .brand i.logo-img img{height:30px;width:auto;display:block}
#side a{transition:background .15s}
.card{border-radius:14px;box-shadow:0 2px 8px rgba(31,58,95,.07)}
.btn{border-radius:9px;transition:transform .15s,background .15s;box-shadow:0 1px 2px rgba(0,0,0,.1)}.btn:hover{transform:translateY(-1px)}
.tw{border-radius:10px;box-shadow:0 1px 3px rgba(31,58,95,.06)}
.page-h h1{font-size:1.6rem}
.tile{border-radius:14px;padding:18px;transition:transform .18s,box-shadow .18s;box-shadow:0 3px 10px rgba(31,58,95,.18)}
.tile:hover{transform:translateY(-3px);box-shadow:0 10px 20px rgba(31,58,95,.28)}
.tile svg{width:26px;height:26px;stroke:var(--gold);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;margin-bottom:8px;display:block}
.kpi{border-radius:12px;box-shadow:0 1px 4px rgba(31,58,95,.07)}
.hero{position:relative;overflow:hidden;border-radius:16px;padding:44px 22px;background:linear-gradient(135deg,#1F3A5F,#162a45);box-shadow:0 8px 24px rgba(31,58,95,.25)}
.hero>*{position:relative;z-index:2}.hero h1{letter-spacing:.04em}
.hero .slides{position:absolute;inset:0;z-index:0}.hero .slides i{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.4s}.hero .slides i.on{opacity:1}
.hero .slides u{position:absolute;inset:0;background:linear-gradient(180deg,rgba(22,42,69,.5),rgba(22,42,69,.82));text-decoration:none}
.auth .box{border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;padding-top:10px}
.plan{position:relative;border:2px solid var(--line);border-radius:18px;padding:26px 18px 18px;text-align:center;background:#fff;cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s}
.plan:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(31,58,95,.16)}
.plan.sel{border-color:var(--gold-d);box-shadow:0 0 0 4px rgba(227,199,102,.45)}
.plan h3{margin:0 0 6px;font-size:1.1rem}.plan .pr{font-size:1.9rem;font-weight:800;color:var(--navy)}
.plan ul{list-style:none;padding:0;margin:14px 0 0;text-align:left;font-size:13px;color:var(--mute)}.plan li{padding:2px 0}.plan li:before{content:"\2713  ";color:var(--green);font-weight:700}
.plan .tag{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--navy);font-size:11px;font-weight:800;padding:3px 14px;border-radius:999px;letter-spacing:.06em;white-space:nowrap}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}.gal .g{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#fff}
.gal img{width:100%;height:120px;object-fit:cover;display:block}.gal .g div{padding:6px 8px;display:flex;justify-content:space-between;align-items:center;font-size:12px}

/* ---- logo + networks + neat polish ---- */
.top-logo{height:42px;width:auto;border-radius:9px;border:2px solid var(--gold);box-shadow:0 2px 8px rgba(0,0,0,.35);background:#fff;display:block}
.auth{position:relative}
.corner-logo{position:absolute;top:14px;right:16px;height:92px;width:auto;border-radius:14px;border:3px solid var(--gold);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.hero>img.hero-logo{position:absolute;top:14px;right:16px;height:84px;width:auto;border-radius:12px;border:2px solid var(--gold);box-shadow:0 6px 18px rgba(0,0,0,.4);z-index:3}
.nets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.net{border:2px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center;background:#fff;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;font-weight:700;color:var(--navy);line-height:1.2}
.net:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(31,58,95,.15)}
.net.sel{border-color:var(--gold-d);box-shadow:0 0 0 4px rgba(227,199,102,.45)}
.net i{display:block;width:38px;height:38px;border-radius:50%;margin:0 auto 6px;color:#fff;font-style:normal;font-weight:800;font-size:13px;line-height:38px}
.net small{display:block;font-weight:400;color:var(--mute);font-size:11px;margin-top:2px}
.plan .pr small{font-size:.9rem;color:var(--mute);font-weight:600}
@media(max-width:560px){.corner-logo{height:60px;top:8px;right:8px}.hero>img.hero-logo{height:52px}.top-logo{height:34px}}

/* ---- coat of arms, edit-words mode ---- */
#top .brand i.coa{background:#fff;padding:3px 5px;height:44px;line-height:0;border-radius:9px;border:2px solid var(--gold);display:inline-block;width:auto}
#top .brand i.coa img{height:36px;width:auto;display:block}
.corner-coa{position:absolute;top:14px;left:16px;height:96px;width:auto;background:#fff;padding:5px;border-radius:14px;border:3px solid var(--gold);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.hero>img.hero-coa{position:absolute;top:14px;left:16px;height:88px;width:auto;background:#fff;padding:4px;border-radius:12px;border:2px solid var(--gold);box-shadow:0 6px 18px rgba(0,0,0,.4);z-index:3}
.slip .coa-s{height:62px;width:auto;display:block;margin:0 auto 4px}
body.editwords #app *:hover{outline:2px dashed var(--gold);outline-offset:1px;cursor:text}
#ewBar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:999px;border:2px solid var(--gold);z-index:90;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.35);font-size:13px}
.perm-t td,.perm-t th{text-align:center}.perm-t td:first-child,.perm-t th:first-child{text-align:left}.perm-t input[type=checkbox]{width:18px;height:18px}
@media(max-width:560px){.corner-coa{height:62px;top:8px;left:8px}.hero>img.hero-coa{height:54px}#top .brand span{display:none}}

.slip{position:relative}
.slip .stampbox{position:absolute;left:50%;bottom:28px;width:118px;height:auto;margin-left:-59px;transform:rotate(-8deg);opacity:.92;mix-blend-mode:multiply;pointer-events:none}
.stamp-prev{height:120px;width:auto;border:1px dashed var(--line);border-radius:10px;padding:4px;background:#fff}

/* ---- hero wording: higher, REPUBLIC OF ZAMBIA larger than MINISTRY OF EDUCATION ---- */
.hero{padding:20px 120px 22px!important}
.hero small{display:block;font-size:2rem;font-weight:800;letter-spacing:.16em;line-height:1.15;color:var(--gold)}
.hero h1{font-size:1.3rem!important;font-weight:700;letter-spacing:.12em!important;margin:.35em 0 .2em!important}
.hero h1+div{font-size:.8rem;margin-top:2px!important;letter-spacing:.2em!important;opacity:.9}
@media(max-width:700px){.hero{padding:74px 12px 16px!important}.hero small{font-size:1.45rem;letter-spacing:.1em}.hero h1{font-size:1.05rem!important}}

/* ---- public landing page + main menu ---- */
.pub{min-height:100vh;display:flex;flex-direction:column;color:#fff;position:relative;background:radial-gradient(1200px 600px at 50% -10%,#2b4f82 0,transparent 60%),linear-gradient(160deg,#162a45,#1F3A5F 55%,#0f2038)}
.pub:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0 2px,transparent 2px 14px);pointer-events:none}
.pub>*{position:relative}
.pub-grid{flex:1;display:grid;grid-template-columns:minmax(220px,1fr) minmax(300px,1.35fr) minmax(280px,1.2fr);gap:30px;align-items:center;width:min(1320px,100%);margin:0 auto;padding:34px 28px 10px}
.pub-left{text-align:center}
.pub-coa{height:120px;width:auto;background:#fff;padding:6px;border-radius:16px;border:3px solid var(--gold);box-shadow:0 10px 28px rgba(0,0,0,.4)}
.pub-left small{display:block;margin-top:16px;font-size:1.7rem;font-weight:800;letter-spacing:.14em;color:var(--gold);line-height:1.15}
.pub-left h2{color:#fff;font-size:1.05rem;letter-spacing:.16em;margin:.5em 0}
.pub-left .rule{width:90px;height:3px;background:var(--gold);margin:14px auto;border-radius:2px}
.pub-left h3{color:#dbe5f3;font-weight:600;letter-spacing:.18em;font-size:.85rem;margin:0 0 16px}
.pub-logo{height:64px;width:auto;margin:0 auto}
.pub-photo{border:4px solid var(--gold);border-radius:18px;overflow:hidden;box-shadow:0 18px 44px rgba(0,0,0,.5);background:#0f2038}
.pub-photo img{display:block;width:100%;height:auto}
.pub-words{background:rgba(10,24,48,.55);border:1px solid rgba(227,199,102,.35);border-left:5px solid var(--gold);border-radius:16px;padding:22px 24px}
.pub-words h1{color:var(--gold);font-size:1.45rem;letter-spacing:.03em;margin:0 0 4px}
.pub-words .tag{font-style:italic;font-weight:600;margin:0 0 12px;color:#fff}
.pub-words h4{color:var(--gold);margin:14px 0 4px;font-size:1.05rem}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ===== LME ENGINE: pure functions mirroring the workbook formulas ===== */
const DEFAULT_SCALE = [
  { grade: 1, min_mark: 70, level: 'Outstanding',          comment: 'Outstanding competence. Keep it up.' },
  { grade: 2, min_mark: 60, level: 'Advanced',             comment: 'Advanced competence. Well done.' },
  { grade: 3, min_mark: 50, level: 'Basic',                comment: 'Basic competence. Aim higher.' },
  { grade: 4, min_mark: 40, level: 'Satisfactory',         comment: 'Satisfactory competence. More effort needed.' },
  { grade: 5, min_mark: 0,  level: 'Unsatisfactory (Fail)',comment: 'Unsatisfactory competence. Needs remedial support.' }
];
const isNum = v => typeof v === 'number' && isFinite(v);
/* Workbook: Grade = 1 + COUNTIF(minimums > mark). 'AB' => absent (null grade). */
function gradeOf(mark, scale = DEFAULT_SCALE) {
  if (!isNum(mark) || mark < 0 || mark > 100) return null;
  return 1 + scale.filter(s => s.min_mark > mark).length;
}
function levelOf(grade, scale = DEFAULT_SCALE) {
  const s = scale.find(x => x.grade === grade); return s ? s.level : '';
}
function commentOf(grade, scale = DEFAULT_SCALE) {
  const s = scale.find(x => x.grade === grade); return s ? s.comment : '';
}
/* Parse an entry: number 0-100, 'AB' (absent) or null (blank) */
function parseMark(v) {
  if (v === null || v === undefined) return null;
  const t = String(v).trim().toUpperCase();
  if (t === '') return null;
  if (t === 'AB') return 'AB';
  const n = Number(t);
  return isFinite(n) && n >= 0 && n <= 100 ? n : null;
}
/* One learner. marks = array (subject 1..n) of number|'AB'|null. form = 1..5 */
function computeLearner(marks, form, scale = DEFAULT_SCALE) {
  const failGrade = scale.length;                       // 5
  const nums = marks.map(m => isNum(m) ? m : null);
  const grades = nums.map(m => gradeOf(m, scale));
  const sat = nums.filter(m => m !== null).length;
  const passed = grades.filter(g => g !== null && g < failGrade).length;
  const top6 = nums.filter(m => m !== null).sort((a, b) => b - a).slice(0, 6);
  const total = top6.reduce((a, b) => a + b, 0);        // "MARKS" = best six marks
  let points = 'FAILED';
  if (form >= 3) {
    const eng = grades[0];
    const others = grades.slice(1).filter(g => g !== null).sort((a, b) => a - b).slice(0, 5);
    if (eng !== null && others.length === 5) {
      const six = [eng, ...others];
      if (!six.some(g => g === failGrade)) points = six.reduce((a, b) => a + b, 0);
    }
  }
  const achieved = form >= 3 ? (passed >= 6 && points !== 'FAILED') : passed >= 6;
  let key;
  if (form >= 3) {
    const eo = Math.sqrt(total * (6 / (points === 'FAILED' ? 1000 : points)));
    key = passed < 6 ? Math.sqrt(eo) : eo;             // EP in the workbook
  } else key = total;                                    // Forms 1-2: total marks
  return { grades, sat, passed, failed: sat - passed, total: round1(total), points, achieved, key,
           result: achieved ? 'COMPETENCE ACHIEVED' : 'COMPETENCE NOT ACHIEVED' };
}
const round1 = n => Math.round(n * 10) / 10;
/* Class: rows = [{id,name,sex,marks:[...]}] -> computed rows with unique positions
   (ties broken by list order, exactly like RANK()+COUNTIF() in the workbook). */
function computeClass(rows, form, scale = DEFAULT_SCALE) {
  const out = rows.map((r, i) => ({ ...r, idx: i, ...computeLearner(r.marks, form, scale) }));
  const order = [...out].sort((a, b) => (b.key - a.key) || (a.idx - b.idx));
  order.forEach((r, i) => r.position = i + 1);
  return out;
}
/* Per-subject analysis: grades 1-5 count, absent, pass%, quality pass%, fail%, by sex */
function subjectAnalysis(rows, subjIndex, scale = DEFAULT_SCALE) {
  const f = (list) => {
    const g = [0,0,0,0,0]; let sat = 0, ab = 0, sum = 0;
    list.forEach(r => { const m = r.marks[subjIndex];
      if (m === 'AB') ab++;
      else if (isNum(m)) { sat++; sum += m; const gr = gradeOf(m, scale); g[gr - 1]++; } });
    const pct = n => sat ? n / sat * 100 : null;
    return { sat, ab, g, mean: sat ? sum / sat : null,
      pass: pct(g[0]+g[1]+g[2]+g[3]), quality: pct(g[0]+g[1]+g[2]), fail: pct(g[4]) };
  };
  return { all: f(rows), boys: f(rows.filter(r => r.sex === 'M')), girls: f(rows.filter(r => r.sex === 'F')) };
}
/* Report-form comments (workbook cells FT/FU/FW/FX) */
function teacherComment(form, c) {
  if (form >= 3) {
    const p = c.points;
    if (p <= 9) return 'Outstanding competence! You are a star learner. Keep shining and help others to grow too.';
    if (p <= 15) return 'Very good progress. Your competence is growing well. Keep practising and aim even higher.';
    if (p <= 21) return 'You have achieved the basic competence. With more practice and a positive attitude you can do even better. Keep going!';
    if (p === 'FAILED') return 'You have made a start and every step counts. With extra support, practice and a never-give-up spirit, you will rise higher next term.';
    return 'You are growing step by step. Keep practising and ask for help when you need it - your competence will get stronger.';
  }
  const t = c.total;
  if (!c.achieved) return 'You have made a good start and every step counts. Your competence is still developing - with practice, support and a never-give-up spirit, you will rise higher next term.';

/* ---------------- SECURITY: lock-out after failed sign-ins + alerts to email / WhatsApp ----------------
   Alerts are sent by the 'security-alert' Supabase Edge Function (see security-alert/index.ts), which holds the real
   email + WhatsApp destinations and API keys on the server. Without it deployed, attempts are still locked out but no message is sent. */
const SEC = { max: 5, mins: 15 };
async function sendAlert(type, detail) {
  const body = { type, detail: String(detail || '').slice(0, 400), time: new Date().toISOString(), page: location.href.split('#')[0], agent: (navigator.userAgent || '').slice(0, 200) };
  try { if (LIVE) await sb.functions.invoke('security-alert', { body }); else console.warn('[SECURITY ALERT - demo mode, not sent]', body); } catch (e) { console.warn('Security alert could not be sent', e); }
}
const secLocked = () => { const d = lsGet('lme_sec', {}); return d.until && Date.now() < d.until ? Math.ceil((d.until - Date.now()) / 60000) : 0; };
function secFail(who, what) {
  const d = lsGet('lme_sec', {}), now = Date.now(); d.fails = (d.fails || []).filter(x => now - x < SEC.mins * 6e4); d.fails.push(now);
  if (d.fails.length >= SEC.max) { d.until = now + SEC.mins * 6e4; d.fails = []; sendAlert('Possible hacking attempt', `${SEC.max} failed ${what || 'sign-in'} attempts in ${SEC.mins} minutes for "${who || 'blank'}". Locked for ${SEC.mins} minutes on that device.`); }
  lsSet('lme_sec', d);
}
const secOK = () => lsSet('lme_sec', {});

const loadLib = (src, g) => new Promise((res, rej) => { if (window[g]) return res(); const t = document.createElement('script'); t.src = src; t.onload = res; t.onerror = () => rej(new Error('Could not load the file reader. Check your internet connection.')); document.head.appendChild(t); });

function rowsToLearners(rows) {

}

    if (d.ds) { const s = S.schools.find(x => x.id === d.ds); modal({ title: 'Delete school', body: `<p><b>This permanently deletes ${esc(s.name)}</b> with all its classes, learners and results. Type the school name to confirm.</p><input id="delName" style="width:100%">`, ok: 'Delete forever', onOk: async () => { if ($('#delName').value.trim() !== s.name) { toast('Name does not match', true); return false; } await DB.remove('schools', s.id); await DB.audit('school.delete', s.name); if (S.school && S.school.id === s.id) S.school = null; await loadSchools(); S.school = S.schools[0] || null; if (S.school) await loadSchoolData(); renderShell(); route(); } }); }
    if (t.id === 'addU') modal({ title: 'Add user', wide: true, ok: 'Create user', body: userForm({ role: 'teacher' }, true), onOk: async m => {
      const f = formData(m); if (!f.full_name || !f.email || (f.password || '').length < 8) { toast('Name, email and a password of 8+ characters are required', true); return false; }
      if (f.role === 'super_admin' && adminUsers.filter(u => u.role === 'super_admin').length >= 3) { toast('Only 3 super administrators are allowed', true); return false; }
      const school_id = isSuper() ? (f.school_id || null) : S.school.id; if (!['super_admin', 'ministry_admin'].includes(f.role) && !school_id) { toast('Choose a school', true); return false; }
      if (LIVE) await createLiveUser({ ...f, school_id });
      else await DB.insert('profiles', { email: f.email, full_name: f.full_name, phone: f.phone, role: f.role, school_id, active: true });
      await DB.audit('user.add', `${f.email} (${f.role})`); await loadUsers(); S.staff = await DB.select('profiles', { school_id: S.school.id }); toast('User created'); route(); } });
    if (d.eu) { const u = adminUsers.find(x => x.id === d.eu); modal({ title: 'Edit user', wide: true, body: userForm(u), onOk: async m => { const f = formData(m); if (isSuper()) { const patch = { full_name: f.full_name, phone: f.phone || null, role: f.role, active: f.active }; patch.school_id = f.school_id || null; await DB.update('profiles', u.id, patch); } else await manageUser(u.id, f.active ? 'approve' : 'deactivate', null, f.full_name, f.phone); await DB.audit('user.edit', u.email); S.staff = await DB.select('profiles', { school_id: S.school.id }); route(); } }); }
    if (d.au) { const u = adminUsers.find(x => x.id === d.au); if (!u.school_id && !isSuper()) return toast('Not linked to a school', true); if (!u.school_id) { modal({ title: 'Approve user', body: `<p>Choose the school and role for <b>${esc(u.full_name)}</b>.</p><div class="field"><label>School</label><select name="school_id">${optList(S.schools.map(s => [s.id, s.name]), S.school && S.school.id)}</select></div><div class="field"><label>Role</label><select name="role">${optList([['teacher', 'Teacher'], ['school_admin', 'School administrator']], u.role)}</select></div>`, ok: 'Approve', onOk: async m => { const f = formData(m); await DB.update('profiles', u.id, { active: true, school_id: f.school_id, role: f.role }); await DB.audit('user.approve', u.email); S.staff = await DB.select('profiles', { school_id: S.school.id }); route(); } }); } else { await manageUser(u.id, 'approve'); await DB.audit('user.approve', u.email); route(); } }
    if (d.xu) { const u = adminUsers.find(x => x.id === d.xu); if (await confirmBox(`Delete ${u.full_name} permanently? Their login will stop working.`, 'Delete')) guard(async () => { await manageUser(u.id, 'delete'); await DB.audit('user.delete', u.email); route(); }); }
    if (d.du) { const u = adminUsers.find(x => x.id === d.du); if (await confirmBox(`Deactivate ${u.full_name}? They will no longer be able to sign in to the system.`, 'Deactivate')) guard(async () => { await manageUser(u.id, 'deactivate'); await DB.audit('user.deactivate', u.email); route(); }); }
  };
  const bind = (id, k) => { const x = $('#' + id, el); if (x) x.oninput = x.onchange = () => { ADMIN_F[k] = x.value; if (id === 'uq') { clearTimeout(bind.t); bind.t = setTimeout(() => route().then(() => { const q = $('#uq'); q && (q.focus(), q.setSelectionRange(q.value.length, q.value.length)); }), 250); } else route(); }; };
  bind('uq', 'q'); bind('ur', 'role'); bind('us', 'school'); bind('ust', 'status');
};

DB.requestTransfer = async d => {
  if (LIVE) { const { data, error } = await sb.rpc('submit_transfer_request', { p_code: d.code, p_guardian: d.guardian, p_phone: d.phone, p_to_school: d.to_school, p_to_district: d.to_district, p_reason: d.reason }); if (error) throw error; return !!data; }
  const l = demo.learners.find(x => x.access_code === d.code.trim() && x.status === 'ACTIVE'); if (!l) return false;
  const c = demo.classes.find(x => x.id === l.class_id);
  demo.transfer_requests.push({ id: uid(), school_id: l.school_id, learner_id: l.id, learner_name: fullName(l), class_label: classLabel(c), guardian_name: d.guardian, guardian_phone: d.phone, to_school: d.to_school, to_district: d.to_district, reason: d.reason, status: 'pending', created_at: new Date().toISOString() });
  demoSave(); return true;
};

}

function applyMode(m) {

function startSlides() {
  clearInterval(window._st); const sl = $$('.lslides i'); if (sl.length < 2) return; let i = 0;
  const go = k => { const d = $$('.ldots b'); sl[i].classList.remove('on'); d[i] && d[i].classList.remove('on'); i = k; sl[i].classList.add('on'); d[i] && d[i].classList.add('on'); };
  window._st = setInterval(() => { if (!$('.lslides')) return clearInterval(window._st); go((i + 1) % sl.length); }, 6500);
  $$('.ldots b').forEach((d, k) => d.onclick = () => { go(k); });
}

}
